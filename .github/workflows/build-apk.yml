name: Build Ionic Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LakbayNaujan-1

    steps:
      # 1. Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Build Ionic/Vue
      - name: Build Ionic app
        run: npm run build

      # 6. Sync Capacitor Android
      - name: Sync Android
        run: npx cap sync android

      # 7. Give Gradle permission
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 8. Build APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakbayNaujan-1
          path: LakbayNaujan-1/android/app/build/outputs/apk/debug/app-debug.apk